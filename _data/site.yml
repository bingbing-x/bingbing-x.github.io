# ---------- 关于我 ----------
about: >
  I am an Associate Professor at the Research Center for Cognitive Intelligence
  Systems and the State Key Laboratory of AI Safety, Institute of Computing
  Technology, Chinese Academy of Sciences (ICT, CAS), where I also serve as a
  master's supervisor.

  From August 2025 to August 2026 I was a visiting scholar at the
  <a href="https://www.nextcenter.org/">NExT++ Research Centre</a>,
  National University of Singapore, hosted by
  <a href="https://www.chuatatseng.com/">Prof. Tat-Seng Chua</a>.

  I received my Ph.D. from ICT, CAS in 2021 under the supervision of
  <a href="https://scholar.google.com/citations?user=hY8aLqAAAAAJ">Prof. Xueqi Cheng</a>
  and
  <a href="http://www.ict.ac.cn/sourcedb/cn/jssrck/201402/t20140221_4037648.html">Prof. Huawei Shen</a>,
  and received my B.S. from Harbin Institute of Technology (Weihai) in 2016.

  My earlier work centers on graph representation learning, in particular
  spectral graph neural networks, with applications in financial risk control
  and social computing.

  My current research focuses on large language models and LLM agents —
  inference-time alignment, process reward modeling, memory and planning for
  agents, and multi-agent social simulation.

