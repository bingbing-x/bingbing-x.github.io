  - title: "TEA: Test-time Energy Adaptation"
    url: https://arxiv.org/abs/2311.14402
    authors: "Yige Yuan, **Bingbing Xu**, Liang Hou, Fei Sun, Huawei Shen, Xueqi Cheng"
    venue: IEEE/CVF Computer Vision and Pattern Recognition Conference (CVPR 2024)
    year: 2024
    type: C
    meta: Seattle WA, USA; Main Track; CCF-A
    links:
      - name: Paper
        url: https://arxiv.org/abs/2311.14402
      - name: Code
        url: https://github.com/yuanyige/tea
    image: cvpr2024-tea-pic.png
    tldr: >
      Investigates generalization from an energy-based perspective and introduces TEA,
      a test-time adaptation method that turns the trained classifier into an
      energy-based model and aligns its distribution with the test data's.

