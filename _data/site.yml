# ---------- 关于我 ----------
about: >
  I am an Associate Professor at the CAS Key Laboratory of AI Safety,
  Institute of Computing Technology, Chinese Academy of Sciences.
  I received my Ph.D. from the Institute of Computing Technology, Chinese Academy
  of Sciences in 2021, under the supervision of
  <a href="https://scholar.google.com/citations?user=hY8aLqAAAAAJ">Prof. Xueqi Cheng</a>
  and
  <a href="http://www.ict.ac.cn/sourcedb/cn/jssrck/201402/t20140221_4037648.html">Prof. Huawei Shen</a>.

  My research centers on graph representation learning — from spectral graph
  neural networks to graph foundation models — and its applications in social
  computing and financial risk analysis.
