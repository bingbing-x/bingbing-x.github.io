---
layout: default
title: News
permalink: /news/
---
{%- assign d = site.data.site -%}

<section>
  <h2>News</h2>
  <ul class="feed feed-full">
    {%- for n in d.news %}
    <li class="feed-item feed-{{ n.kind | default: 'misc' }}">
      <span class="feed-date">{{ n.date }}</span>
      <span class="feed-text">{{ n.text }}</span>
    </li>
    {%- endfor %}
  </ul>
</section>
