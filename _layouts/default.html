<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.data.site.profile.name_en }} &middot; {{ site.data.site.profile.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <meta name="author" content="{{ site.data.site.profile.name_en }}">

  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}">
  <link rel="canonical" href="{{ site.url }}">
  <link rel="stylesheet" href="{{ '/static/css/main.css' | relative_url }}">

  <!-- Open Graph：分享到社交平台时的预览卡片 -->
  <meta property="og:type" content="profile">
  <meta property="og:title" content="{{ site.data.site.profile.name_en }} &middot; {{ site.data.site.profile.title }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:url" content="{{ site.url }}">

  <!-- 在页面绘制前确定主题，避免深色模式下闪白 -->
  <script>
    (function () {
      var t = localStorage.getItem('color-theme');
      if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>

  {%- if site.data.site.analytics_id and site.data.site.analytics_id != '' %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.data.site.analytics_id }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ site.data.site.analytics_id }}');
  </script>
  {%- endif %}
</head>
<body>

<button id="theme-toggle" type="button" aria-label="Toggle dark mode">
  <svg id="icon-moon" class="hidden" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
    <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/>
  </svg>
  <svg id="icon-sun" class="hidden" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
    <path fill-rule="evenodd" clip-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"/>
  </svg>
</button>

<div class="wrap">
  {{ content }}
</div>

<script src="{{ '/static/js/main.js' | relative_url }}"></script>
</body>
</html>
